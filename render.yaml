services:
  - type: web
    name: hotel-qr-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: STAFF_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: MAIN_BACKEND_URL
        sync: false
      - key: MAIN_BACKEND_API_KEY
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "1800"

  - type: web
    name: hotel-demo-main-backend
    runtime: python
    rootDir: demo_main_backend
    buildCommand: pip install -r requirements.txt
    startCommand: python demo_main_backend.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: MAIN_BACKEND_API_KEY
        sync: false
